name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, 'claude/**']
    tags: ['v*']
    paths:
      - 'lib/**'
      - 'android/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write # attach the APK to a GitHub Release on v* tags

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true

      - name: Release keystore
        env:
          KEYSTORE_B64: ${{ secrets.TSD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/tsd.jks"
            echo "TSD_KEYSTORE_PATH=$RUNNER_TEMP/tsd.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No TSD_KEYSTORE_BASE64 secret: APK is signed with a throwaway debug key and will NOT install as an update over other builds."
          fi

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos

      - name: Build
        env:
          TSD_KEYSTORE_PASSWORD: ${{ secrets.TSD_KEYSTORE_PASSWORD }}
          TSD_KEY_ALIAS: ${{ secrets.TSD_KEY_ALIAS }}
          TSD_KEY_PASSWORD: ${{ secrets.TSD_KEY_PASSWORD }}
        # build number = run number, so every new APK installs over the previous one
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Name the APK
        id: apk
        run: |
          ver=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          name="timkon-tsd-${ver}-${{ github.run_number }}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "APK: **$name** ($(du -h "$name" | cut -f1))" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.name }}
          retention-days: 30

      - name: GitHub Release (v* tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.name }}
