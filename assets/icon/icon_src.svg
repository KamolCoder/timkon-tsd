<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14B8A6"/>
      <stop offset="1" stop-color="#0F5F59"/>
    </linearGradient>
  </defs>
  <g id="background"><rect width="1024" height="1024" fill="url(#bg)"/></g>
  <g id="foreground">
    <!-- scan frame corners -->
    <g fill="none" stroke="#FFFFFF" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" opacity="0.95">
      <path d="M272 362 V312 Q272 272 312 272 H362"/>
      <path d="M662 272 H712 Q752 272 752 312 V362"/>
      <path d="M272 662 V712 Q272 752 312 752 H362"/>
    </g>
    <!-- barcode -->
    <g fill="#FFFFFF">
      <rect x="330" y="350" width="22" height="300" rx="4"/>
      <rect x="372" y="350" width="10" height="300" rx="3"/>
      <rect x="400" y="350" width="30" height="300" rx="4"/>
      <rect x="450" y="350" width="12" height="300" rx="3"/>
      <rect x="480" y="350" width="22" height="300" rx="4"/>
      <rect x="522" y="350" width="10" height="300" rx="3"/>
      <rect x="550" y="350" width="34" height="300" rx="4"/>
      <rect x="604" y="350" width="14" height="300" rx="3"/>
      <rect x="638" y="350" width="22" height="300" rx="4"/>
      <rect x="680" y="350" width="10" height="300" rx="3"/>
    </g>
    <!-- red scan line -->
    <rect x="300" y="492" width="424" height="16" rx="8" fill="#FB7185"/>
    <!-- check badge -->
    <circle cx="700" cy="700" r="108" fill="#A3E635" stroke="#0F5F59" stroke-width="22"/>
    <path d="M648 702 L688 742 L756 668" fill="none" stroke="#0F5F59" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
